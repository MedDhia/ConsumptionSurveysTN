[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests", "scripts"]

[tool.ruff.lint]
# E/W pycodestyle, F pyflakes, I import order, B bugbear, UP pyupgrade.
# Deliberately no `ruff format`: reformatting the whole tree would bury real changes
# in whitespace churn. Lint only.
select = ["E", "W", "F", "I", "B", "UP"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-q"
markers = [
    "needs_raw: requires the INS artefacts in data/raw (run `make fetch` first)",
]
