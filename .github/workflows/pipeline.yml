# Full pipeline: fetch the INS artefacts, build every dataset, and reproduce INS's
# published headline figures from the microdata.
#
# data/raw is cached on the committed manifest's hash, so pull requests reuse the base
# branch's copy and ins.tn is only contacted when the manifest changes or the cache
# expires. On a cache miss an ins.tn outage can turn this red for reasons unrelated to
# the diff; download.py retries four times with exponential backoff, and that residual
# risk is the price of having the reproduction checks actually gate merges.
name: pipeline

on:
  workflow_dispatch:
  schedule:
    # Mondays, 06:00 UTC.
    - cron: "0 6 * * 1"
  pull_request:
    paths:
      - "src/**"
      - "tests/**"
      - "scripts/**"
      - "requirements*.txt"
      - "Makefile"
      - "pyproject.toml"
      - ".github/workflows/pipeline.yml"

permissions:
  contents: read

concurrency:
  group: pipeline-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-validate:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-dev.txt

      - name: Install bsdtar, pdftotext and Python requirements
        env:
          REQUIREMENTS: requirements-dev.txt
        run: ./scripts/setup.sh

      - name: Restore the INS downloads
        uses: actions/cache@v4
        with:
          path: data/raw
          key: ins-raw-${{ hashFiles('data/raw/manifest.json') }}

      - name: Fetch anything the cache did not supply
        run: make fetch

      - name: Verify checksums against the committed manifest
        run: make verify

      - name: Build every dataset and codebook
        run: make build

      - name: Reproduce INS's published figures
        run: pytest -v

      - name: Confirm the committed datasets and codebooks match a fresh build
        # The build is deterministic, so any diff here means the committed files were
        # produced by different code than the tree now contains.
        run: git diff --exit-code -- docs/codebooks data/processed

      - uses: actions/upload-artifact@v4
        with:
          name: consumption-datasets
          path: data/processed
          retention-days: 14

  upstream-drift:
    # Scheduled only, and deliberately cache-free: the point is to re-download from
    # ins.tn and notice if INS has republished a file under the same URL. A red run here
    # is the alarm, not a bug.
    if: github.event_name == 'schedule'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install requests
      - name: Has INS changed anything?
        run: make check-upstream
