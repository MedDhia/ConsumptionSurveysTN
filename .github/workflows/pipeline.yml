# Full pipeline: fetch the INS artefacts and the statistical yearbooks, build every
# dataset, and reproduce INS's published headline figures from the microdata.
#
# data/raw is cached on the committed manifest's hash, so pull requests reuse the base
# branch's copy and ins.tn is only contacted when the manifest changes or the cache
# expires. On a cache miss an ins.tn outage can turn this red for reasons unrelated to
# the diff; download.py retries four times with exponential backoff, and that residual
# risk is the price of having the reproduction checks actually gate merges.
name: pipeline

on:
  workflow_dispatch:
  schedule:
    # Mondays, 06:00 UTC.
    - cron: "0 6 * * 1"
  # Deliberately unfiltered, unlike the pull_request trigger below. This run exists to
  # check the state that actually landed, and the state that landed is a merge commit
  # that no pull_request run ever saw: a PR is tested against its own head merged with
  # the base at the time, so anything merged in between is untested here. Any paths
  # filter would reopen that hole for whichever commit happened to fall outside it.
  push:
    branches: [main]
  pull_request:
    paths:
      - "src/**"
      - "tests/**"
      - "scripts/**"
      - "requirements*.txt"
      - "Makefile"
      - "pyproject.toml"
      - ".github/workflows/pipeline.yml"
      # The last step compares these against a fresh build, so a diff that edits them
      # and nothing else is exactly what that step is for -- and would otherwise be the
      # one kind of change that skips the check meant to catch it.
      - "data/processed/**"
      - "docs/codebooks/**"

permissions:
  contents: read

concurrency:
  group: pipeline-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-validate:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-dev.txt

      - name: Install bsdtar, pdftotext and Python requirements
        env:
          REQUIREMENTS: requirements-dev.txt
        run: ./scripts/setup.sh

      - name: Restore the INS downloads
        uses: actions/cache@v4
        with:
          path: data/raw
          key: ins-raw-${{ hashFiles('data/raw/manifest.json') }}

      - name: Fetch anything the cache did not supply
        run: make fetch

      - name: Verify checksums against the committed manifest
        run: make verify

      - name: Build every dataset and codebook
        run: make build

      - name: Reproduce INS's published figures
        run: pytest -v

      - name: Confirm the committed datasets and codebooks match a fresh build
        # The build is deterministic, so any diff here means the committed files were
        # produced by different code than the tree now contains.
        run: git diff --exit-code -- docs/codebooks data/processed

      - uses: actions/upload-artifact@v4
        with:
          name: consumption-datasets
          path: data/processed
          retention-days: 14

  upstream-drift:
    # Deliberately cache-free: the point is to re-download from ins.tn and notice if INS
    # has republished a file under the same URL. A red run here is the alarm, not a bug.
    #
    # Runs on the weekly schedule and on demand only. Not on pull requests or pushes --
    # force-fetching roughly 290 MB (the yearbook mirror is most of it) is not a cost a
    # PR should pay, and a source changing unrelated to the diff is not a reason to
    # block one, nor to redden a merge that has already happened.
    #
    # A download that comes back as an error or interstitial page rather than the file is
    # rejected on its magic bytes before it reaches the manifest, so a red run here means
    # a checksum genuinely moved, not that a host served a consent screen.
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt
      # `make check-upstream` goes through consumptiontn.cli, which imports pandas and
      # every build module at import time. Installing only `requests` -- what the drift
      # check itself needs -- looks leaner and fails at the first import.
      - run: pip install -r requirements.txt
      - name: Has INS changed anything?
        run: make check-upstream
