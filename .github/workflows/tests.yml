# Fast lane. Gates every push and pull request.
#
# Deliberately touches nothing but PyPI: no apt packages, no INS downloads. That keeps
# this workflow's result a statement about the diff rather than about ins.tn's uptime.
# The tests that reproduce INS's published figures need 86 MB of survey data and live in
# pipeline.yml.
name: checks

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: checks-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-dev.txt
      - run: pip install ruff
      - run: ruff check .

  test-fast:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: requirements-dev.txt
      - run: pip install -r requirements-dev.txt
      - name: Structural tests (no data, no network)
        run: pytest -m "not needs_raw" -v
